<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Resource Consents</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Top Bar -->
    <header id="topbar">
        <div class="topbar-left">
            <h1><i class="fas fa-file-contract"></i> Resource Consents Viewer</h1>
        </div>
        <div class="topbar-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearch" placeholder="Search consents by ID, holder, address, purpose..." />
            </div>
            <div class="topbar-filter-group" id="regionFilter" aria-label="Region filter">
                <span class="topbar-filter-label">Region</span>
                <label class="region-pill"><input type="checkbox" value="BOPRC" checked /> <span>BOPRC</span></label>
                <label class="region-pill"><input type="checkbox" value="HBDC" checked /> <span>HBDC</span></label>
                <label class="region-pill"><input type="checkbox" value="NRC" checked /> <span>NRC</span></label>
                <label class="region-pill"><input type="checkbox" value="HRC" checked /> <span>HRC</span></label>
                <label class="region-pill"><input type="checkbox" value="WRC" checked /> <span>WRC</span></label>
                <label class="region-pill"><input type="checkbox" value="TRC" checked /> <span>TRC</span></label>
                <label class="region-pill"><input type="checkbox" value="GWRC" checked /> <span>GWRC</span></label>
                <label class="region-pill"><input type="checkbox" value="GDC" checked /> <span>GDC</span></label>
            </div>
        </div>
        <div class="topbar-right">
            <div class="alert-badges" id="alertBadges"></div>
            <button id="toggleFilters" class="btn-icon" title="Toggle Filters"><i class="fas fa-filter"></i></button>
        </div>
    </header>

    <div id="main-container">
        <!-- Sidebar Filters -->
        <aside id="sidebar" class="open">
            <div class="sidebar-header">
                <h2><i class="fas fa-sliders-h"></i> Filters</h2>
                <button id="clearFilters" class="btn-small">Clear All</button>
            </div>
            <div class="sidebar-group open">
                <button type="button" class="accordion-toggle" aria-expanded="true">
                    <span>
                        <span class="accordion-title">Quick Filters</span>
                        <span class="accordion-subtitle">Status and expiry alerts</span>
                    </span>
                    <i class="fas fa-chevron-down accordion-icon"></i>
                </button>
                <div class="accordion-panel">
                    <div class="filter-section">
                        <label>Status</label>
                        <div id="filterStatus" class="checkbox-group"></div>
                    </div>
                    <div class="filter-section">
                        <label>Expiry Alert</label>
                        <div id="filterExpiry" class="checkbox-group">
                            <label class="cb"><input type="checkbox" value="expired" /> <span class="badge badge-expired">Expired</span></label>
                            <label class="cb cb-sub"><input type="checkbox" value="expired-30" /> <span class="badge badge-expired">Expired ≤30 days ago</span></label>
                            <label class="cb cb-sub"><input type="checkbox" value="expired-60" /> <span class="badge badge-expired">Expired ≤60 days ago</span></label>
                            <label class="cb cb-sub"><input type="checkbox" value="expired-90" /> <span class="badge badge-expired">Expired ≤90 days ago</span></label>
                            <label class="cb cb-sub"><input type="checkbox" value="expired-180" /> <span class="badge badge-expired">Expired ≤6 months ago</span></label>
                            <label class="cb cb-sub"><input type="checkbox" value="expired-365" /> <span class="badge badge-expired">Expired ≤12 months ago</span></label>
                            <label class="cb"><input type="checkbox" value="30" /> <span class="badge badge-critical">Within 30 days</span></label>
                            <label class="cb"><input type="checkbox" value="60" /> <span class="badge badge-warning">Within 60 days</span></label>
                            <label class="cb"><input type="checkbox" value="90" /> <span class="badge badge-caution">Within 90 days</span></label>
                            <label class="cb"><input type="checkbox" value="180" /> <span class="badge badge-info">Within 6 months</span></label>
                            <label class="cb"><input type="checkbox" value="365" /> <span class="badge badge-note">Within 12 months</span></label>
                        </div>
                    </div>
                    <div class="filter-summary" id="filterSummary">Showing all consents</div>
                </div>
            </div>

            <div class="sidebar-group">
                <button type="button" class="accordion-toggle" aria-expanded="false">
                    <span>
                        <span class="accordion-title">Consent Details</span>
                        <span class="accordion-subtitle">Subtype and category</span>
                    </span>
                    <i class="fas fa-chevron-down accordion-icon"></i>
                </button>
                <div class="accordion-panel">
                    <div class="filter-section">
                        <label>Subtype</label>
                        <div id="filterSubtype" class="checkbox-group"></div>
                    </div>
                    <div class="filter-section">
                        <label>Category</label>
                        <div id="filterCategory" class="checkbox-group"></div>
                    </div>
                </div>
            </div>

            <div class="sidebar-group">
                <button type="button" class="accordion-toggle" aria-expanded="false">
                    <span>
                        <span class="accordion-title">Location &amp; Officer</span>
                        <span class="accordion-subtitle">Zone, area and compliance owner</span>
                    </span>
                    <i class="fas fa-chevron-down accordion-icon"></i>
                </button>
                <div class="accordion-panel">
                    <div class="filter-section">
                        <label>Water Management Zone</label>
                        <select id="filterZone" class="filter-select"><option value="">All Zones</option></select>
                    </div>
                    <div class="filter-section">
                        <label>Water Management Area</label>
                        <select id="filterArea" class="filter-select"><option value="">All Areas</option></select>
                    </div>
                    <div class="filter-section">
                        <label>Compliance Officer</label>
                        <select id="filterOfficer" class="filter-select"><option value="">All Officers</option></select>
                    </div>
                </div>
            </div>

            <div class="sidebar-group">
                <button type="button" class="accordion-toggle" aria-expanded="false">
                    <span>
                        <span class="accordion-title">Date Filters</span>
                        <span class="accordion-subtitle">Expiry and granted ranges</span>
                    </span>
                    <i class="fas fa-chevron-down accordion-icon"></i>
                </button>
                <div class="accordion-panel">
                    <div class="filter-section">
                        <label>Expiry Date Range</label>
                        <div class="date-range">
                            <input type="date" id="expiryFrom" /> <span>to</span> <input type="date" id="expiryTo" />
                        </div>
                    </div>
                    <div class="filter-section">
                        <label>Granted Date Range</label>
                        <div class="date-range">
                            <input type="date" id="grantedFrom" /> <span>to</span> <input type="date" id="grantedTo" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-group open">
                <button type="button" class="accordion-toggle" aria-expanded="true">
                    <span>
                        <span class="accordion-title">Watchlist</span>
                        <span class="accordion-subtitle">Saved consent folders</span>
                    </span>
                    <i class="fas fa-chevron-down accordion-icon"></i>
                </button>
                <div class="accordion-panel">
                    <div class="wl-section">
                        <div class="wl-header">
                            <h2><i class="fas fa-bookmark"></i> Watchlist</h2>
                            <button id="wlCreateFolder" class="btn-small" title="New Folder"><i class="fas fa-plus"></i> New</button>
                        </div>
                        <div id="watchlistFolders" class="wl-folders"></div>
                        <div class="wl-io-buttons">
                            <button id="wlExport" class="btn-small" title="Export watchlist"><i class="fas fa-download"></i> Export</button>
                            <button id="wlImport" class="btn-small" title="Import watchlist"><i class="fas fa-upload"></i> Import</button>
                            <input type="file" id="wlImportFile" accept=".json" style="display:none" />
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div id="content">
            <!-- View toggle bar (always visible) -->
            <div id="viewToggleBar">
                <button id="viewSplit" class="view-btn active" title="Split View"><i class="fas fa-columns"></i> Split</button>
                <button id="viewMap" class="view-btn" title="Map Only"><i class="fas fa-map"></i> Map</button>
                <button id="viewTable" class="view-btn" title="Table Only"><i class="fas fa-table"></i> Table</button>
            </div>
            <!-- Map -->
            <div id="map-container">
                <div id="map"></div>
            </div>
            <!-- Drag handle -->
            <div id="resizeHandle"><div class="handle-grip"><i class="fas fa-grip-lines"></i></div></div>
            <!-- Table -->
            <div id="table-container">
                <div class="results-overview">
                    <div class="results-stats" id="resultsStats" aria-live="polite"></div>
                    <div class="active-filters is-empty" id="activeFilters" aria-live="polite"></div>
                </div>
                <div class="table-toolbar">
                    <div class="table-info" id="tableInfo" aria-live="polite">Loading...</div>
                    <div class="table-controls">
                        <button id="exportFilteredCsv" class="btn-secondary" type="button" title="Export currently filtered results to CSV">
                            <i class="fas fa-file-csv"></i> Export CSV
                        </button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table id="consentsTable">
                        <thead>
                            <tr>
                                <th class="star-header"><i class="fas fa-star"></i></th>
                                <th data-sort="ConsentID">Consent ID <i class="fas fa-sort"></i></th>
                                <th data-sort="Status">Status <i class="fas fa-sort"></i></th>
                                <th data-sort="HolderDisplay">Holder / Authority <i class="fas fa-sort"></i></th>
                                <th data-sort="SiteAddress">Address <i class="fas fa-sort"></i></th>
                                <th data-sort="Purpose">Purpose <i class="fas fa-sort"></i></th>
                                <th data-sort="Subtype">Subtype <i class="fas fa-sort"></i></th>
                                <th data-sort="Category">Category <i class="fas fa-sort"></i></th>
                                <th data-sort="ExpiryDate">Expiry <i class="fas fa-sort"></i></th>
                                <th data-sort="GrantedDate">Granted <i class="fas fa-sort"></i></th>
                                <th>Docs</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <!-- Folder Picker (floating) -->
    <div id="folderPicker" class="folder-picker hidden"></div>

    <!-- Detail Panel -->
    <div id="detailPanel" class="detail-panel hidden">
        <div class="detail-header">
            <i id="detailStar" class="far fa-star detail-star" title="Add to watchlist"></i>
            <h3 id="detailTitle">Consent Details</h3>
            <button id="closeDetail" class="btn-icon"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailContent" class="detail-content"></div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading consent datasets...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
</body>
</html>
